<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación Exitosa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .checkmark-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #10b981;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        .checkmark {
            font-size: 60px;
            color: white;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .user-info {
            background: #f3f4f6;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1.5rem 0;
        }

        .user-info p {
            margin: 0.5rem 0;
            color: #4b5563;
            font-size: 1rem;
        }

        .user-info strong {
            color: #1f2937;
        }

        .level-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .level-admin {
            background: #ef4444;
            color: white;
        }

        .level-manager {
            background: #f59e0b;
            color: white;
        }

        .level-user {
            background: #3b82f6;
            color: white;
        }

        .redirect-message {
            color: #6b7280;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark-circle">
            <span class="checkmark"></span>
        </div>
        
        <h1>Autenticacion Exitosa</h1>
        
        <div class="user-info">
            <p><strong>Usuario:</strong> {{ user.displayName }}</p>
            <p><strong>Nivel de Acceso:</strong></p>
            <span class="level-badge {% if user.permissions.is_admin %}level-admin{% elif user.permissions.is_manager %}level-manager{% else %}level-user{% endif %}">
                {{ user.permissions.level }}
            </span>
        </div>

        <div class="redirect-message">
            Redirigiendo al dashboard<span class="spinner"></span>
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = '/dashboard';
        }, 3000);
    </script>
</body>
</html>
